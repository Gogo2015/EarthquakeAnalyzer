---
version: "3"

services:
  redis-db:
    image: redis:7
    ports:
      - 6379:6379
    volumes:
      - ./data:/data
    command: ["--save", "1", "1"]
  flask-app:
    build:
      context: ./
      dockerfile: ./Dockerfile
    depends_on:
      - redis-db
    image: mitragaurav10/api:1.0
    ports:
      - 5000:5000
    environment:
      - REDIS_IP=redis-db

  worker:
    build:
      context: ./
      dockerfile: ./Dockerfile
    depends_on:
      - redis-db
    image: mitragaurav10/api:1.0
    environment:
      - REDIS_IP=redis-db
    command: ["worker.py"]
