---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-flask-app
  labels:
    app: test-flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-flask-app
  template:
    metadata:
      labels:
        app: test-flask-app
    spec:
      containers:
        - name: test-flask-app
          imagePullPolicy: Always
          image: mitragaurav10/api:1.0
          command: ['sh', '-c', 'python3 /code/test_api.py || true; echo "Tests completed at $(date)"; sleep 3600']
          ports:
          - name: http
            containerPort: 5000
          env:
          - name: LOG_LEVEL
            value: DEBUG
