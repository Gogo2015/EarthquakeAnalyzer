---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-flask-app
  labels:
    app: test-flask-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-flask-app
  template:
    metadata:
      labels:
        app: test-flask-app
    spec:
      containers:
        - name: test-flask-app
          imagePullPolicy: Always
          image: mitragaurav10/api:1.0
          command: ['python3', '/path/to/test/test_api.py']  
          ports:
          - name: http
            containerPort: 5000
          env:
          - name: LOG_LEVEL
            value: DEBUG
